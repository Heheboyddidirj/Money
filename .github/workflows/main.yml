name: Android Cloud Emulator

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Thời gian chạy (phút)"
        required: false
        default: "300"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. SETUP ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK="$ANDROID_HOME"

          sudo apt-get update
          sudo apt-get install -y wget unzip curl

          mkdir -p "$SDK/cmdline-tools"

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then

            echo "sdkmanager not found."
            echo "Installing Android Command Line Tools..."

            cd /tmp

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O commandlinetools.zip

            rm -rf "$SDK/cmdline-tools/latest"

            mkdir -p "$SDK/cmdline-tools/latest"

            unzip -q commandlinetools.zip \
              -d "$SDK/cmdline-tools/latest"

            if [ -d "$SDK/cmdline-tools/latest/cmdline-tools" ]; then

              mv \
                "$SDK/cmdline-tools/latest/cmdline-tools/"* \
                "$SDK/cmdline-tools/latest/"

              rm -rf \
                "$SDK/cmdline-tools/latest/cmdline-tools"

            fi

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$SDK" -name sdkmanager -type f || true
            exit 1
          fi

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      # =========================================================
      # 4. INSTALL ANDROID 15
      # =========================================================
      - name: Install Android packages
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          echo ""
          echo "Installed packages:"
          "$SDKMANAGER" --list_installed | grep -E \
            "platform-tools|emulator|system-images|platforms;android-35" || true

      # =========================================================
      # 5. KVM
      # =========================================================
      - name: Enable KVM
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM available:"
            ls -lh /dev/kvm
          else
            echo "WARNING: /dev/kvm is not available."
          fi

      # =========================================================
      # 6. CREATE AVD
      # =========================================================
      - name: Create Android 15 AVD
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "Creating Android 15 AVD..."

          echo "no" | avdmanager create avd \
            --name CloudAndroid \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo ""
          echo "========== AVD INFORMATION =========="

          avdmanager list avd

          # -------------------------------------------------------
          # Get the REAL AVD path created by avdmanager
          # -------------------------------------------------------

          AVD_DIR=$(avdmanager list avd \
            | awk '
              /Name: CloudAndroid/ {found=1}
              found && /Path:/ {
                sub(/^.*Path:[[:space:]]*/, "")
                print
                exit
              }
            ')

          if [ -z "$AVD_DIR" ]; then
            echo "ERROR: Cannot determine AVD path."
            avdmanager list avd
            exit 1
          fi

          echo ""
          echo "REAL AVD PATH:"
          echo "$AVD_DIR"

          if [ ! -d "$AVD_DIR" ]; then
            echo "ERROR: AVD directory does not exist:"
            echo "$AVD_DIR"
            exit 1
          fi

          CONFIG="$AVD_DIR/config.ini"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: config.ini not found:"
            echo "$CONFIG"

            echo ""
            echo "AVD contents:"
            find "$AVD_DIR" -maxdepth 2 -type f -print || true

            exit 1
          fi

          echo ""
          echo "Updating AVD configuration..."

          set_config() {
            KEY="$1"
            VALUE="$2"

            if grep -q "^${KEY}=" "$CONFIG"; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$CONFIG"
            else
              echo "${KEY}=${VALUE}" >> "$CONFIG"
            fi
          }

          set_config "hw.ramSize" "2048"
          set_config "hw.cpu.ncore" "2"

          set_config "hw.lcd.width" "1280"
          set_config "hw.lcd.height" "720"
          set_config "hw.lcd.density" "320"

          set_config "hw.keyboard" "yes"

          set_config "hw.gpu.enabled" "yes"
          set_config "hw.gpu.mode" "swiftshader_indirect"

          echo ""
          echo "========== FINAL CONFIG =========="

          cat "$CONFIG"

          echo ""
          echo "========== AVD LIST =========="

          emulator -list-avds

      # =========================================================
      # 7. GUI PACKAGES
      # =========================================================
      - name: Install GUI tools
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            fluxbox \
            curl \
            wget \
            unzip

      # =========================================================
      # 8. X DISPLAY
      # =========================================================
      - name: Start virtual display
        shell: bash
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          sleep 3

          fluxbox \
            > /tmp/fluxbox.log 2>&1 &

          echo $! > /tmp/fluxbox.pid

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          echo "Virtual display started."

      # =========================================================
      # 9. START ANDROID EMULATOR
      # =========================================================
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          export DISPLAY=:99

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "Starting Android Emulator..."

          nohup emulator \
            -avd CloudAndroid \
            -port 5554 \
            -no-snapshot \
            -no-boot-anim \
            -noaudio \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            > /tmp/emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "$EMULATOR_PID" > /tmp/emulator.pid

          echo "Emulator PID: $EMULATOR_PID"

          adb start-server

          echo ""
          echo "Waiting for emulator..."

          DEVICE_FOUND=false

          for i in $(seq 1 120); do

            if adb devices | grep -q "emulator-5554"; then
              DEVICE_FOUND=true
              echo "Emulator detected."
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator stopped."

              echo ""
              echo "========== EMULATOR LOG =========="

              cat /tmp/emulator.log || true

              exit 1
            fi

            sleep 2

          done

          if [ "$DEVICE_FOUND" != "true" ]; then
            echo "ERROR: Emulator not detected."

            adb devices -l || true

            echo ""
            echo "========== EMULATOR LOG =========="

            tail -300 /tmp/emulator.log || true

            exit 1
          fi

          adb wait-for-device

          echo ""
          echo "Waiting for Android boot..."

          BOOTED=false

          for i in $(seq 1 180); do

            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)

            echo "Boot status: $BOOT"

            if [ "$BOOT" = "1" ]; then
              BOOTED=true
              break
            fi

            sleep 2

          done

          if [ "$BOOTED" != "true" ]; then

            echo "ERROR: Android failed to boot."

            echo ""
            echo "========== EMULATOR LOG =========="

            tail -300 /tmp/emulator.log || true

            exit 1

          fi

          echo ""
          echo "Android boot completed."

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo ""
          echo "========== DEVICE =========="

          adb devices -l

          echo ""
          echo "Android version:"
          adb shell getprop ro.build.version.release

          echo "SDK:"
          adb shell getprop ro.build.version.sdk

          echo "Model:"
          adb shell getprop ro.product.model

          echo "ABI:"
          adb shell getprop ro.product.cpu.abi

      # =========================================================
      # 10. VNC
      # =========================================================
      - name: Start VNC server
        shell: bash
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -rfbport 5900 \
            -nopw \
            -noxdamage \
            > /tmp/x11vnc.log 2>&1 &

          echo $! > /tmp/x11vnc.pid

          sleep 3

          echo "VNC started on port 5900."

      # =========================================================
      # 11. NOVNC
      # =========================================================
      - name: Start noVNC
        shell: bash
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &

          echo $! > /tmp/websockify.pid

          sleep 3

          echo "noVNC started on port 6080."

          echo ""
          echo "Listening ports:"

          ss -lntp | grep -E "5900|6080" || true

      # =========================================================
      # 12. CLOUDFLARE TUNNEL
      # =========================================================
      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          cd /tmp

          rm -f cloudflared

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "$CLOUDFLARED_PID" > /tmp/cloudflared.pid

          echo ""
          echo "Waiting for Cloudflare tunnel..."

          URL=""

          for i in $(seq 1 90); do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2

          done

          echo ""
          echo "===================================================="
          echo "              ANDROID CLOUD EMULATOR"
          echo "===================================================="

          if [ -n "$URL" ]; then

            echo ""
            echo "OPEN THIS IN CHROME:"
            echo ""
            echo "$URL/vnc.html"
            echo ""

          else

            echo ""
            echo "Cloudflare URL not found."
            echo ""
            cat /tmp/cloudflared.log || true

          fi

          echo ""
          echo "===================================================="

      # =========================================================
      # 13. OPTIONAL APK
      # =========================================================
      - name: Install app.apk
        if: ${{ hashFiles('app.apk') != '' }}
        shell: bash
        run: |
          echo "Installing app.apk..."

          adb install -r app.apk

          echo "APK installed."

      # =========================================================
      # 14. STATUS
      # =========================================================
      - name: Show Android status
        shell: bash
        run: |
          echo "========== ADB =========="

          adb devices -l

          echo ""
          echo "========== SYSTEM =========="

          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.model
          adb shell getprop ro.product.cpu.abi

          echo ""
          echo "========== MEMORY =========="

          adb shell cat /proc/meminfo | head -20

      # =========================================================
      # 15. KEEP ALIVE
      # =========================================================
      - name: Keep Android running
        shell: bash
        run: |
          MINUTES="${{ github.event.inputs.duration || '300' }}"

          echo "Android emulator will run for $MINUTES minutes."

          END=$((SECONDS + MINUTES * 60))

          while [ "$SECONDS" -lt "$END" ]; do

            echo ""
            echo "=========================================="
            echo "$(date)"
            echo "=========================================="

            adb devices -l || true

            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)

            echo "Android boot: $BOOT"

            sleep 30

          done

      # =========================================================
      # 16. LOGS
      # =========================================================
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
