name: Android Cloud Emulator

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Thời gian chạy (phút)"
        required: false
        default: "300"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. SETUP JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. FIND ANDROID SDK
      # =========================================================
      - name: Setup Android SDK PATH
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK="$ANDROID_HOME"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$SDK/platform-tools:$SDK/emulator:$PATH"

          echo "PATH=$PATH"

          echo "Searching sdkmanager..."

          find "$SDK" -type f -name sdkmanager 2>/dev/null || true

          SDKMANAGER=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            echo "Installing Android command line tools..."

            sudo apt-get update

            sudo apt-get install -y \
              wget \
              unzip \
              curl

            mkdir -p "$SDK/cmdline-tools"

            cd /tmp

            wget -q \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O cmdline-tools.zip

            rm -rf "$SDK/cmdline-tools/latest"

            mkdir -p "$SDK/cmdline-tools/latest"

            unzip -q cmdline-tools.zip \
              -d "$SDK/cmdline-tools/latest"

            mv \
              "$SDK/cmdline-tools/latest/cmdline-tools/"* \
              "$SDK/cmdline-tools/latest/"

            rm -rf "$SDK/cmdline-tools/latest/cmdline-tools"

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

      # =========================================================
      # 4. EXPORT SDK PATH FOR NEXT STEPS
      # =========================================================
      - name: Export Android tools
        run: |
          SDK="$ANDROID_HOME"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      # =========================================================
      # 5. INSTALL ANDROID COMPONENTS
      # =========================================================
      - name: Install Android components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Installing Android SDK..."

          "$SDKMANAGER" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          echo "SDK installation complete."

      # =========================================================
      # 6. ENABLE KVM
      # =========================================================
      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm

          sudo chmod 666 /dev/kvm || true

          echo "KVM:"
          ls -lh /dev/kvm || true

      # =========================================================
      # 7. CREATE AVD
      # =========================================================
      - name: Create Android 15 AVD
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          mkdir -p "$HOME/.android"

          echo "no" | avdmanager create avd \
            --name CloudAndroid \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          CONFIG="$HOME/.android/avd/CloudAndroid.avd/config.ini"

          cat >> "$CONFIG" <<'EOF'
          hw.ramSize=2048
          hw.cpu.ncore=2
          hw.lcd.width=1280
          hw.lcd.height=720
          hw.lcd.density=320
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=8G
          EOF

          echo "Available AVDs:"
          emulator -list-avds

      # =========================================================
      # 8. INSTALL GUI
      # =========================================================
      - name: Install GUI components
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            fluxbox \
            curl \
            wget \
            unzip

      # =========================================================
      # 9. START X SERVER
      # =========================================================
      - name: Start virtual display
        shell: bash
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

          fluxbox \
            > /tmp/fluxbox.log 2>&1 &

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # =========================================================
      # 10. START ANDROID
      # =========================================================
      - name: Start Android Emulator
        shell: bash
        run: |
          export DISPLAY=:99
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          nohup emulator \
            -avd CloudAndroid \
            -port 5554 \
            -no-snapshot \
            -no-boot-anim \
            -noaudio \
            -gpu swiftshader_indirect \
            -memory 2048 \
            > /tmp/emulator.log 2>&1 &

          echo $! > /tmp/emulator.pid

          adb start-server

          echo "Waiting for ADB..."

          for i in $(seq 1 120); do
            if adb devices | grep -q "emulator-5554"; then
              echo "Emulator detected."
              break
            fi

            sleep 2
          done

          adb wait-for-device

          echo "Waiting for Android boot..."

          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$BOOT" = "1" ]; then
              echo "Android boot completed."
              break
            fi

            echo "Boot status: $BOOT"

            sleep 2
          done

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo ""
          echo "========== DEVICE =========="

          adb devices -l

          echo ""
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.model
          adb shell getprop ro.product.cpu.abi

      # =========================================================
      # 11. VNC
      # =========================================================
      - name: Start VNC
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -rfbport 5900 \
            -nopw \
            -noxdamage \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

          echo "VNC running on port 5900."

      # =========================================================
      # 12. NOVNC
      # =========================================================
      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &

          sleep 3

          echo "noVNC running on port 6080."

      # =========================================================
      # 13. CLOUDFLARE
      # =========================================================
      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          cd /tmp

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo "Waiting for tunnel..."

          for i in $(seq 1 60); do

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "=================================================="
          echo " ANDROID CLOUD PHONE"
          echo "=================================================="

          if [ -n "$URL" ]; then
            echo ""
            echo "$URL/vnc.html"
            echo ""
            echo "Open this address in Chrome."
          else
            echo ""
            echo "Cloudflare URL not found."
            echo ""
            cat /tmp/cloudflared.log
          fi

          echo ""
          echo "=================================================="

      # =========================================================
      # 14. OPTIONAL APK
      # =========================================================
      - name: Install app.apk
        if: ${{ hashFiles('app.apk') != '' }}
        run: |
          adb install -r app.apk || true

      # =========================================================
      # 15. KEEP ALIVE
      # =========================================================
      - name: Keep emulator alive
        shell: bash
        run: |
          MINUTES="${{ github.event.inputs.duration || '300' }}"

          echo "Running for $MINUTES minutes."

          END=$((SECONDS + MINUTES * 60))

          while [ "$SECONDS" -lt "$END" ]; do

            echo ""
            echo "=============================="
            echo "$(date)"
            echo "=============================="

            adb devices -l || true

            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)

            echo "Android boot: $BOOT"

            sleep 30
          done

      # =========================================================
      # 16. SAVE LOGS
      # =========================================================
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
