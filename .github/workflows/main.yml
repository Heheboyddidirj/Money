name: Cloud Android Emulator

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Thời gian giữ máy (phút)"
        required: true
        default: "300"
        type: number
      install_apk:
        description: "Cài app.apk nếu file tồn tại ở thư mục gốc"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    name: Android GUI + noVNC
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
      AVD_NAME: CloudAndroid
      API_LEVEL: "35"
      DISPLAY: ":99"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Basic runner check
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -a)"
          echo "CPU: $(nproc)"
          free -h || true

          test -e /dev/kvm || {
            echo "::error::/dev/kvm không tồn tại trên runner này."
            exit 1
          }

          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

          echo "KVM OK: $(ls -l /dev/kvm)"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

      - name: Install host GUI packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            unzip \
            wget \
            curl \
            git \
            xvfb \
            x11vnc \
            x11-utils \
            fluxbox \
            socat

          echo "Host packages OK"

      - name: Prepare Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT}"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            rm -rf "$SDK/cmdline-tools/latest"

            TMP="$(mktemp -d)"
            cd "$TMP"

            wget -q --show-progress \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O cmdline-tools.zip

            unzip -q cmdline-tools.zip

            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a cmdline-tools/. "$SDK/cmdline-tools/latest/"

            rm -rf "$TMP"
          fi

          {
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_USER_HOME=$HOME/.android"
            echo "ANDROID_AVD_HOME=$HOME/.android/avd"

            echo "$SDK/cmdline-tools/latest/bin"
            echo "$SDK/platform-tools"
            echo "$SDK/emulator"
          } >> "$GITHUB_PATH"

          mkdir -p "$HOME/.android/avd"
          chmod -R u+rwX "$HOME/.android"

          echo "===== SDK ====="
          sdkmanager --version

          echo "===== AVD Manager ====="
          avdmanager --version

          echo "===== Emulator ====="
          emulator -version | head -n 3

          echo "===== ADB ====="
          adb version | head -n 2

      - name: Install Android API 35 emulator
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT}"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

          echo "===== Installed Android packages ====="

          sdkmanager --list_installed | grep -E \
            'platform-tools|emulator|platforms;android-35|system-images;android-35;google_apis;x86_64' \
            || true

      - name: Create and verify AVD
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT}"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"

          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          mkdir -p "$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME"

          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"

          # Xóa AVD cũ để tránh config sai từ các lần chạy trước.
          avdmanager delete avd \
            -n "$AVD_NAME" \
            >/dev/null 2>&1 || true

          rm -rf \
            "$ANDROID_AVD_HOME/$AVD_NAME.avd" \
            "$ANDROID_AVD_HOME/$AVD_NAME.ini"

          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --sdcard 512M

          AVD_DIR="$ANDROID_AVD_HOME/$AVD_NAME.avd"
          AVD_INI="$ANDROID_AVD_HOME/$AVD_NAME.ini"

          echo "AVD_DIR=$AVD_DIR"
          echo "AVD_INI=$AVD_INI"

          # Kiểm tra file thật sự tồn tại.
          test -f "$AVD_INI"
          test -f "$AVD_DIR/config.ini"

          # Tối ưu AVD.
          printf '%s\n' \
            'hw.ramSize=2048' \
            'hw.cpu.ncore=2' \
            'hw.lcd.width=1280' \
            'hw.lcd.height=720' \
            'hw.lcd.density=320' \
            'hw.keyboard=yes' \
            'hw.gpu.enabled=yes' \
            'hw.gpu.mode=swiftshader_indirect' \
            'showDeviceFrame=no' \
            'skin.dynamic=yes' >> "$AVD_DIR/config.ini"

          echo "===== avdmanager list avd ====="

          avdmanager list avd

          echo "===== AVD directory ====="

          ls -lah "$ANDROID_AVD_HOME"
          ls -lah "$AVD_DIR"

          echo "===== emulator -list-avds ====="

          emulator -list-avds | tee /tmp/avds.txt

          # Đây là check quan trọng để tránh lỗi:
          # Unknown AVD name [CloudAndroid]
          grep -Fx "$AVD_NAME" /tmp/avds.txt

          echo "AVD CloudAndroid FOUND."

          # Persist sang các step tiếp theo.
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail

          pkill Xvfb || true
          rm -f /tmp/.X99-lock || true

          Xvfb "$DISPLAY" \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          for i in {1..30}; do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          xdpyinfo -display "$DISPLAY" >/dev/null

          echo "Xvfb OK: $DISPLAY"

          # Window manager.
          DISPLAY="$DISPLAY" \
            fluxbox >/tmp/fluxbox.log 2>&1 &

      - name: Start Android Emulator
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT}"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"

          # QUAN TRỌNG:
          # Emulator phải nhìn đúng thư mục chứa CloudAndroid.avd
          # và CloudAndroid.ini.
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export DISPLAY=":99"

          echo "================================"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "DISPLAY=$DISPLAY"
          echo "================================"

          echo "===== Available AVDs ====="

          emulator -list-avds | tee /tmp/avds.txt

          # Nếu không thấy CloudAndroid thì DỪNG ngay,
          # không chạy emulator để tránh lỗi Unknown AVD.
          grep -Fx "$AVD_NAME" /tmp/avds.txt

          echo "CloudAndroid is available."

          echo "===== Start ADB ====="

          adb start-server

          rm -f emulator.log

          echo "===== Starting emulator ====="

          emulator \
            -avd "$AVD_NAME" \
            -gpu swiftshader_indirect \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -camera-back none \
            -accel on \
            > emulator.log 2>&1 &

          EMULATOR_PID=$!

          echo "$EMULATOR_PID" > emulator.pid

          echo "Emulator PID: $EMULATOR_PID"

          echo "===== Waiting for Android ====="

          for i in {1..120}; do

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Emulator đã dừng trước khi boot."

              echo "===== emulator.log ====="
              cat emulator.log || true

              exit 1
            fi

            if adb devices \
              | grep -qE '^emulator-[0-9]+[[:space:]]+device$'; then

              if adb shell getprop sys.boot_completed \
                2>/dev/null \
                | tr -d '\r' \
                | grep -q '^1$'; then

                break
              fi
            fi

            sleep 2
          done

          if ! adb shell getprop sys.boot_completed \
            2>/dev/null \
            | tr -d '\r' \
            | grep -q '^1$'; then

            echo "::error::Android Emulator không boot hoàn tất."

            echo "===== adb devices ====="
            adb devices || true

            echo "===== emulator.log ====="
            cat emulator.log || true

            exit 1
          fi

          echo "================================"
          echo "ANDROID BOOT COMPLETED"
          echo "================================"

          # Không tự tắt màn hình.
          adb shell settings put system \
            screen_off_timeout 2147483647 || true

          # Tắt animation.
          adb shell settings put global \
            window_animation_scale 0 || true

          adb shell settings put global \
            transition_animation_scale 0 || true

          adb shell settings put global \
            animator_duration_scale 0 || true

          echo "===== Android info ====="

          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell wm size
          adb shell wm density

      - name: Start VNC server
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY=":99"

          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -listen 127.0.0.1 \
            -forever \
            -shared \
            -noxdamage \
            -nopw \
            -bg \
            -o x11vnc.log

          sleep 2

          pgrep -af x11vnc

          echo "VNC OK: 127.0.0.1:5900"

      - name: Start noVNC
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/noVNC"

          git clone \
            --depth 1 \
            --recurse-submodules \
            https://github.com/novnc/noVNC.git \
            "$RUNNER_TEMP/noVNC"

          cd "$RUNNER_TEMP/noVNC"

          ./utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" > "$RUNNER_TEMP/novnc.pid"

          echo "===== Waiting for noVNC ====="

          for i in {1..30}; do

            if curl -fsS \
              http://127.0.0.1:6080/vnc.html \
              >/dev/null 2>&1; then

              break
            fi

            sleep 1
          done

          curl -fsS \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "noVNC OK: http://127.0.0.1:6080/vnc.html"

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          ARCH="$(dpkg --print-architecture)"

          case "$ARCH" in
            amd64)
              CF_BIN="cloudflared-linux-amd64"
              ;;

            arm64)
              CF_BIN="cloudflared-linux-arm64"
              ;;

            *)
              echo "::error::CPU architecture không được hỗ trợ: $ARCH"
              exit 1
              ;;
          esac

          mkdir -p "$RUNNER_TEMP/cloudflared"

          wget -q \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/${CF_BIN}" \
            -O "$RUNNER_TEMP/cloudflared/cloudflared"

          chmod +x \
            "$RUNNER_TEMP/cloudflared/cloudflared"

          "$RUNNER_TEMP/cloudflared/cloudflared" \
            --version

          echo "===== Starting Cloudflare ====="

          "$RUNNER_TEMP/cloudflared/cloudflared" \
            tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$RUNNER_TEMP/cloudflared/cloudflared.log" 2>&1 &

          CF_PID=$!

          echo "$CF_PID" \
            > "$RUNNER_TEMP/cloudflared/cloudflared.pid"

          URL=""

          for i in {1..60}; do

            URL="$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared/cloudflared.log" \
                | head -n 1 \
                || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$CF_PID" 2>/dev/null; then
              echo "::error::cloudflared đã dừng."

              cat \
                "$RUNNER_TEMP/cloudflared/cloudflared.log" \
                || true

              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Không lấy được TryCloudflare URL."

            cat \
              "$RUNNER_TEMP/cloudflared/cloudflared.log" \
              || true

            exit 1
          fi

          NOVNC_URL="$URL/vnc.html?autoconnect=true&resize=remote"

          echo "NOVNC_URL=$NOVNC_URL" \
            >> "$GITHUB_ENV"

          {
            echo "## 🟢 Cloud Android đã sẵn sàng"
            echo
            echo "**noVNC:** $NOVNC_URL"
            echo
            echo "- Android API: 35"
            echo "- AVD: CloudAndroid"
            echo "- Resolution: 1280x720"
            echo "- VNC: 127.0.0.1:5900"
            echo "- noVNC: 127.0.0.1:6080"
            echo
            echo "> ⚠️ TryCloudflare Quick Tunnel là URL công khai và dành cho testing."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "================================"
          echo "noVNC URL:"
          echo "$NOVNC_URL"
          echo "================================"

      - name: Optional APK install
        if: ${{ inputs.install_apk }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f app.apk ]; then
            echo "::warning::install_apk=true nhưng không tìm thấy app.apk ở thư mục gốc."
            exit 0
          fi

          adb install -r app.apk

          echo "APK installed."

      - name: Verify GUI end-to-end
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Android ====="

          adb devices

          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

          echo "===== noVNC ====="

          curl -fsSI \
            http://127.0.0.1:6080/vnc.html \
            | head

          echo "===== Processes ====="

          pgrep -af \
            'emulator|x11vnc|fluxbox|cloudflared' \
            || true

          echo "===== Ports ====="

          ss -lntp \
            | grep -E ':5900|:6080' \
            || true

          test -n "${NOVNC_URL:-}"

          echo "GUI END-TO-END OK"
          echo "$NOVNC_URL"

      - name: Keep emulator alive
        shell: bash
        run: |
          set -euo pipefail

          DURATION="${{ inputs.duration }}"

          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "::error::duration phải là số nguyên."
            exit 1
          fi

          if [ "$DURATION" -lt 5 ]; then
            echo "::error::duration tối thiểu là 5 phút."
            exit 1
          fi

          if [ "$DURATION" -gt 350 ]; then
            echo "::error::duration tối đa là 350 phút."
            exit 1
          fi

          echo "Giữ emulator trong $DURATION phút."

          for ((minute=1; minute<=DURATION; minute++)); do

            sleep 60

            if ! pgrep \
              -f 'emulator.*CloudAndroid' \
              >/dev/null; then

              echo "::error::Emulator đã dừng ở khoảng phút $minute."

              cat emulator.log || true

              exit 1
            fi

            if ! adb shell getprop sys.boot_completed \
              2>/dev/null \
              | tr -d '\r' \
              | grep -q '^1$'; then

              echo "::error::Android không còn boot_completed."

              exit 1
            fi

            if (( minute % 10 == 0 )); then
              echo "Đã chạy $minute/$DURATION phút."
            fi

          done

      - name: Collect logs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$RUNNER_TEMP/android-logs"

          cp -f \
            emulator.log \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            emulator.pid \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            x11vnc.log \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            /tmp/xvfb.log \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            /tmp/fluxbox.log \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            "$RUNNER_TEMP/novnc.log" \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          cp -f \
            "$RUNNER_TEMP/cloudflared/cloudflared.log" \
            "$RUNNER_TEMP/android-logs/" \
            2>/dev/null || true

          adb logcat -d \
            > "$RUNNER_TEMP/android-logs/adb-logcat.txt" \
            2>&1 || true

          adb devices \
            > "$RUNNER_TEMP/android-logs/adb-devices.txt" \
            2>&1 || true

          emulator -list-avds \
            > "$RUNNER_TEMP/android-logs/avds.txt" \
            2>&1 || true

          {
            echo "===== Final process list ====="

            pgrep -af \
              'emulator|x11vnc|fluxbox|cloudflared' \
              || true

          } > "$RUNNER_TEMP/android-logs/system.txt"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-android-logs
          path: ${{ runner.temp }}/android-logs/
          if-no-files-found: warn
          retention-days: 3
