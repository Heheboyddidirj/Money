name: Android Cloud Emulator

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Thời gian chạy (phút)"
        required: false
        default: "300"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # =========================================================
      # 2. ENABLE KVM
      # =========================================================
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          echo "KVM:"
          ls -l /dev/kvm || true

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      # =========================================================
      # 4. CREATE AVD
      # =========================================================
      - name: Create Android 15 AVD
        run: |
          mkdir -p "$HOME/.android/avd"

          echo "no" | avdmanager create avd \
            --name "CloudAndroid" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          AVD="$HOME/.android/avd/CloudAndroid.avd/config.ini"

          cat >> "$AVD" <<'EOF'
          hw.ramSize=2048
          hw.cpu.ncore=2
          hw.lcd.width=1280
          hw.lcd.height=720
          hw.lcd.density=320
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.keyboard=yes
          disk.dataPartition.size=8G
          EOF

          echo "AVD created:"
          emulator -list-avds

      # =========================================================
      # 5. INSTALL GUI TOOLS
      # =========================================================
      - name: Install Xvfb VNC noVNC
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            fluxbox \
            curl \
            wget \
            unzip

      # =========================================================
      # 6. START VIRTUAL DISPLAY
      # =========================================================
      - name: Start virtual display
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x720x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &

          sleep 3

          fluxbox >/tmp/fluxbox.log 2>&1 &

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # =========================================================
      # 7. START ANDROID EMULATOR
      # =========================================================
      - name: Start Android Emulator
        run: |
          export DISPLAY=:99

          nohup emulator \
            -avd CloudAndroid \
            -port 5554 \
            -no-snapshot \
            -no-boot-anim \
            -noaudio \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -memory 2048 \
            > /tmp/emulator.log 2>&1 &

          echo $! > /tmp/emulator.pid

          echo "Waiting for emulator..."

          adb start-server

          for i in $(seq 1 120); do
            if adb devices | grep -q "emulator-5554"; then
              echo "ADB device detected"
              break
            fi

            sleep 2
          done

          adb wait-for-device

          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$BOOT" = "1" ]; then
              echo "Android boot completed!"
              break
            fi

            echo "Boot status: $BOOT"
            sleep 2
          done

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "Android information:"
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.model
          adb shell getprop ro.product.cpu.abi

      # =========================================================
      # 8. START VNC
      # =========================================================
      - name: Start VNC server
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -rfbport 5900 \
            -nopw \
            -noxdamage \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

          echo "VNC started on port 5900"

      # =========================================================
      # 9. START NOVNC
      # =========================================================
      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 \
            > /tmp/novnc.log 2>&1 &

          sleep 3

          echo "noVNC started on port 6080"

      # =========================================================
      # 10. CLOUDFLARE QUICK TUNNEL
      # =========================================================
      - name: Start Cloudflare Tunnel
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$URL" ]; then
              break
            fi

            sleep 2
          done

          echo ""
          echo "======================================================"
          echo " ANDROID WEB GUI"
          echo "======================================================"

          if [ -n "$URL" ]; then
            echo "$URL/vnc.html"
            echo ""
            echo "Open the URL above in Chrome."
            echo "======================================================"
          else
            echo "Cloudflare URL was not detected."
            cat /tmp/cloudflared.log
          fi

      # =========================================================
      # 11. INSTALL APK IF AVAILABLE
      # =========================================================
      - name: Install APK
        if: ${{ hashFiles('app.apk') != '' }}
        run: |
          adb install -r app.apk || true
          adb shell pm list packages | head -50

      # =========================================================
      # 12. SHOW STATUS
      # =========================================================
      - name: Android status
        run: |
          echo "========== ADB =========="
          adb devices -l

          echo ""
          echo "========== Android =========="
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.model

          echo ""
          echo "========== Memory =========="
          adb shell free -h || true

      # =========================================================
      # 13. KEEP RUNNING
      # =========================================================
      - name: Keep Android running
        run: |
          MINUTES="${{ github.event.inputs.duration || '300' }}"

          echo "Android Emulator will stay online for ${MINUTES} minutes."

          END=$((SECONDS + MINUTES * 60))

          while [ $SECONDS -lt $END ]; do
            echo ""
            echo "========== $(date) =========="

            adb devices -l || true

            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)

            echo "Boot: $BOOT"

            sleep 30
          done

      # =========================================================
      # 14. DEBUG LOGS
      # =========================================================
      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
